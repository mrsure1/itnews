<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Hub - 스마트한 AI 소식 큐레이션</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(23, 23, 23, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      overflow-x: hidden;
    }
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 1rem;
    }
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-5px);
      border-color: var(--accent-primary);
      box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.3);
    }
    .tab-active {
      background: var(--accent-primary);
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    .split-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 1024px) {
      .split-view { grid-template-columns: 1fr; }
    }
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    /* 스크롤바 디자인 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-50 px-6 py-4 glass border-b border-white/10 mx-4 mt-4 mb-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i class="fas fa-robot text-white text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold gradient-text">AI News Hub</h1>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex p-1 bg-white/5 rounded-2xl border border-white/10">
        <button id="btn-all" onclick="switchView('all')" class="px-6 py-2 rounded-xl text-sm font-medium transition-all duration-300 tab-active">전체보기</button>
        <button id="btn-news" onclick="switchView('news')" class="px-6 py-2 rounded-xl text-sm font-medium transition-all duration-300 hover:bg-white/10">뉴스</button>
        <button id="btn-youtube" onclick="switchView('youtube')" class="px-6 py-2 rounded-xl text-sm font-medium transition-all duration-300 hover:bg-white/10">유튜브</button>
      </nav>

      <div class="hidden md:flex items-center gap-4 text-sm text-gray-400">
        <span id="last-update">업데이트 확인 중...</span>
        <button onclick="location.reload()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-[1600px] mx-auto px-6">
    <div id="content-area" class="split-view">
      
      <!-- Left: News Articles -->
      <section id="news-section" class="flex flex-col gap-6">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold flex items-center gap-2">
            <i class="far fa-newspaper text-blue-400"></i> 최신 신문 기사
          </h2>
        </div>
        <div id="news-list" class="bento-grid">
          <!-- Articles will be loaded here -->
          <div class="col-span-full py-20 text-center text-gray-500">데이터를 불러오는 중...</div>
        </div>
      </section>

      <!-- Right: YouTube Videos -->
      <section id="youtube-section" class="flex flex-col gap-6 border-l border-white/5 pl-0 lg:pl-6">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold flex items-center gap-2">
            <i class="fab fa-youtube text-red-500"></i> AI 유튜브 트렌드
          </h2>
        </div>
        <div id="youtube-list" class="bento-grid">
          <!-- Videos will be loaded here -->
        </div>
      </section>

    </div>
  </main>

  <!-- Data Load Script -->
  <script src="news_data.js"></script>
  <script>
    let currentData = window.NEWS_DATA || [];
    let currentView = 'all';

    function init() {
      renderData();
      if (currentData.length > 0) {
        const lastItem = currentData[0];
        const lastUpdate = new Date(lastItem.수집일시);
        document.getElementById('last-update').innerText = `마지막 업데이트: ${lastUpdate.toLocaleString('ko-KR')}`;
      }
    }

    function switchView(view) {
      currentView = view;
      const contentArea = document.getElementById('content-area');
      const newsSection = document.getElementById('news-section');
      const youtubeSection = document.getElementById('youtube-section');
      
      // Update Buttons
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('tab-active', 'bg-white/10'));
      document.getElementById(`btn-${view}`).classList.add('tab-active');

      if (view === 'all') {
        contentArea.className = 'split-view';
        newsSection.classList.remove('hidden');
        youtubeSection.classList.remove('hidden');
        youtubeSection.classList.add('border-l');
      } else if (view === 'news') {
        contentArea.className = 'block';
        newsSection.classList.remove('hidden');
        youtubeSection.classList.add('hidden');
      } else if (view === 'youtube') {
        contentArea.className = 'block';
        newsSection.classList.add('hidden');
        youtubeSection.classList.remove('hidden');
        youtubeSection.classList.remove('border-l');
      }

      renderData();
    }

    function renderData() {
      const newsList = document.getElementById('news-list');
      const youtubeList = document.getElementById('youtube-list');

      const newsData = currentData.filter(item => item.type === 'article' || !item.type);
      const youtubeData = currentData.filter(item => item.type === 'youtube');

      // Render News
      newsList.innerHTML = newsData.map(item => `
        <div class="glass card-hover p-5 flex flex-col gap-4 overflow-hidden relative group">
          <div class="flex justify-between items-start">
            <span class="text-xs font-semibold px-2 py-1 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">${item.매체 || 'News'}</span>
            <span class="text-[10px] text-gray-500">${timeSince(item.수집일시)}</span>
          </div>
          <a href="${item.링크}" target="_blank" class="text-lg font-bold hover:text-blue-400 transition-colors line-clamp-2 leading-snug">
            ${item.제목}
          </a>
          <p class="text-sm text-gray-400 line-clamp-3">
            ${item.요약 || '상세 내용은 링크를 통해 확인해 주세요.'}
          </p>
          <div class="mt-auto pt-4 flex justify-between items-center border-t border-white/5">
             <span class="text-xs text-gray-500">${item.국가 || ''}</span>
             <i class="fas fa-external-link-alt text-xs text-gray-600 group-hover:text-blue-400"></i>
          </div>
        </div>
      `).join('');

      // Render YouTube
      youtubeList.innerHTML = youtubeData.map(item => `
        <div class="glass card-hover overflow-hidden group">
          <div class="relative aspect-video">
            <img src="${item.이미지}" alt="${item.제목}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
              <div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center shadow-xl shadow-red-600/30">
                <i class="fas fa-play text-white ml-1"></i>
              </div>
            </div>
          </div>
          <div class="p-5 flex flex-col gap-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-red-400 uppercase tracking-wider">${item.매체}</span>
              <span class="text-[10px] text-gray-500">${timeSince(item.수집일시)}</span>
            </div>
            <a href="${item.링크}" target="_blank" class="text-lg font-bold line-clamp-2 leading-tight group-hover:text-red-400 transition-colors">
              ${item.제목}
            </a>
            <p class="text-sm text-gray-400 line-clamp-3">
              ${item.요약}
            </p>
          </div>
        </div>
      `).join('');
    }

    function timeSince(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "년 전";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "개월 전";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "일 전";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "시간 전";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "분 전";
      return Math.floor(seconds) + "초 전";
    }

    window.onload = init;
  </script>
</body>
</html>
