<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Hub - 스마트한 AI 소식 큐레이션</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
      --card-border: rgba(0, 0, 0, 0.05);
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }
    .hero-banner {
      height: 200px;
      background: url('banner.png') center/cover no-repeat;
      border-radius: 1.5rem;
      position: relative;
      overflow: hidden;
      margin-bottom: 2rem;
      box-shadow: var(--card-shadow);
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
      display: flex;
      align-items: center;
      padding: 0 3rem;
    }
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
      /* <a>로 쓰일 때 기본 링크 스타일 제거 */
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border-color: var(--accent-primary);
    }
    a.card, a.card:visited { color: inherit; }
    .tab-active {
      background: var(--accent-primary);
      color: white !important;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }
    .split-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 1024px) {
      .split-view { grid-template-columns: 1fr; }
    }
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    /* 날짜 탭 */
    .date-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      cursor: pointer;
      white-space: nowrap;
      transition: all .18s ease;
    }
    .date-tab:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }
    .date-tab.selected {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #2563eb;
      box-shadow: 0 4px 10px rgba(59,130,246,0.15);
    }
    .date-tab .count {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 500;
    }
    .date-tab.selected .count { color: #60a5fa; }
    /* Floating top 버튼 */
    .scroll-top-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      background: var(--accent-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(59, 130, 246, 0.35), 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      z-index: 60;
      opacity: 0;
      transform: translateY(20px) scale(0.8);
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease, background-color .2s ease;
      border: none;
    }
    .scroll-top-btn:hover {
      background: #2563eb;
      transform: translateY(0) scale(1.05);
    }
    .scroll-top-btn.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    @media (max-width: 640px) {
      .scroll-top-btn { right: 16px; bottom: 16px; width: 44px; height: 44px; }
    }
    /* 스크롤바 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-header px-6 py-3">
    <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-md">
          <i class="fas fa-robot text-white"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800">AI News Hub</h1>
      </div>

      <nav class="flex p-1 bg-gray-100 rounded-xl">
        <button id="btn-all" onclick="switchView('all')" class="px-5 py-1.5 rounded-lg text-sm font-semibold transition-all tab-active">전체보기</button>
        <button id="btn-news" onclick="switchView('news')" class="px-5 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:text-gray-800 transition-all">뉴스</button>
        <button id="btn-youtube" onclick="switchView('youtube')" class="px-5 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:text-gray-800 transition-all">유튜브</button>
      </nav>

      <div class="hidden md:flex items-center gap-4 text-xs text-gray-400">
        <span id="last-update">마지막 업데이트 확인 중...</span>
        <button onclick="location.reload()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-6 mt-6">
    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-overlay">
        <div>
          <h2 class="text-3xl font-extrabold text-gray-900 mb-2">AI News Hub</h2>
          <p class="text-gray-600 font-medium">최신 AI 기술과 트렌드를 한눈에 확인하세요.</p>
        </div>
      </div>
    </div>

    <!-- 날짜별 보기 (최근 7일) -->
    <div id="date-tabs" class="flex flex-wrap gap-2 items-center mb-8">
      <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mr-2">
        <i class="far fa-calendar-alt mr-1"></i> 날짜별 보기
      </span>
    </div>

    <!-- 상단: 한국 뉴스 + 한국 유튜브 (split-view) -->
    <div id="content-area" class="split-view">
      <!-- Left: Korean News Articles -->
      <section id="news-section">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-bold flex items-center gap-2">
            <i class="far fa-newspaper text-blue-600"></i> 국내 최신 뉴스
          </h3>
        </div>
        <div id="news-list" class="bento-grid">
          <div class="col-span-full py-20 text-center text-gray-400">로딩 중...</div>
        </div>
      </section>

      <!-- Right: Korean YouTube Videos -->
      <section id="youtube-section" class="border-l border-gray-200 pl-0 lg:pl-8">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-bold flex items-center gap-2">
            <i class="fab fa-youtube text-red-600"></i> 추천 AI 유튜브
            <span class="text-[10px] font-medium text-gray-400 ml-1">글로벌 공식 + 한국어 키워드</span>
          </h3>
        </div>
        <div id="youtube-list" class="bento-grid">
          <!-- Videos -->
        </div>
      </section>
    </div>

    <!-- 하단: 미국 기사/블로그 카드 -->
    <section id="us-news-section" class="mt-12">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fas fa-globe-americas text-indigo-600"></i> 해외(미국) 기사 &amp; 블로그
        </h3>
      </div>
      <div id="us-news-list" class="bento-grid">
        <!-- US articles -->
      </div>
    </section>
  </main>

  <!-- Floating: 맨 위로 -->
  <button id="scroll-top-btn" class="scroll-top-btn" aria-label="맨 위로" title="맨 위로"
          onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script src="news_data.js"></script>
  <script>
    // 자동 수집 데이터 (Action 이 매일 갱신)
    const RAW_NEWS_DATA = window.NEWS_DATA || [];
    // 본인이 admin.html 에서 관리하는 오버라이드 (삭제/핀)
    let overridesData = { deleted: [], pinned: [] };
    // 합성 결과 (RAW_NEWS_DATA + pinned − deleted)
    let currentData = [];
    let currentView = 'all';

    // YYYY-MM-DD 형식의 오늘 날짜 (로컬 타임존 기준)
    function todayStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // 초기값은 오늘. 오늘 데이터가 0개면 init()에서 가장 최근에 데이터가 있는 날짜로 자동 폴백.
    let selectedDate = todayStr();

    // 표시할 데이터가 1개 이상 있는 가장 최근 날짜를 반환.
    // 오늘 → 어제 → ... 6일 전 순서로 검사. 모두 없으면 오늘 반환.
    function effectiveDate() {
      const today = new Date();
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;
        if (currentData.some(item => getItemDate(item) === dateStr)) return dateStr;
      }
      return todayStr();
    }

    // 글로벌 AI 공식 채널 (영어 OK, [공식] 배지 표시)
    // Suno 는 AI 음악 채널이라 사용자 요청에 따라 제외
    const GLOBAL_OFFICIAL_CHANNELS = [
      'OpenAI', 'Anthropic', 'Google DeepMind', 'Google for Developers',
      'NVIDIA', 'NVIDIA AI', 'NVIDIA Developer',
      'AI at Meta', 'Microsoft', 'Microsoft Developer',
      'Cursor', 'ElevenLabs', 'Runway',
      'Hugging Face', 'Perplexity'
    ];

    // AI 음악 영상 차단 키워드 (제목 + 매체 만 검사. 요약 본문 검사는 'audio'/'studio' 등에 의한
    // false positive 가 다수 발생하므로 제외. 'udio' 단독 키워드도 같은 이유로 제외.)
    const AI_MUSIC_KEYWORDS = [
      'suno',
      'ai 음악', 'ai음악', 'a.i 음악',
      'ai 노래', 'ai노래', 'ai 작곡', 'ai작곡',
      'ai 커버', 'ai커버', 'ai cover',
      'ai song', 'ai music', 'ai-generated music', 'ai generated music',
      'ai 보컬', 'ai보컬', 'ai vocal',
      '음악 만들기', '노래 만들기',
      'ai로 만든 음악', 'ai가 만든 음악', 'ai로 작곡',
      'ai로 만든 노래', 'ai가 만든 노래'
    ];

    function isAiMusic(item) {
      const t = `${item.제목 || ''} ${item.매체 || ''}`.toLowerCase();
      return AI_MUSIC_KEYWORDS.some(k => t.includes(k));
    }

    // 기존 한국 크리에이터 (과거 수집분 호환)
    const LEGACY_KOREAN_CHANNELS = [
      'Nomad Coders', '코딩알려주는누나', '원투코딩 OneTwoCoding',
      '노정석', '테크몽', '조코딩 JoCoding', '빵형의 개발도상국'
    ];

    function isOfficialChannel(item) {
      const m = (item.매체 || '').trim();
      return item.source === 'global_official' || GLOBAL_OFFICIAL_CHANNELS.includes(m);
    }

    // 한글이 포함된 텍스트인지 검사
    function hasKorean(text) {
      return /[\uac00-\ud7a3]/.test(text || '');
    }

    // 표시 대상 유튜브 영상:
    //  - 글로벌 공식 채널: 영어 OK
    //  - 그 외: 제목 또는 채널명에 한글이 있어야 표시 (한국어 컨텐츠)
    //  - 과거 한국 크리에이터 데이터도 표시
    function shouldShowYouTube(item) {
      if (item.type !== 'youtube') return false;
      // AI 음악 영상은 무조건 차단 (수집 누락 분에 대한 안전장치)
      if (isAiMusic(item)) return false;
      if (isOfficialChannel(item)) return true;
      const m = (item.매체 || '').trim();
      if (LEGACY_KOREAN_CHANNELS.includes(m)) return true;
      return hasKorean(item.제목) || hasKorean(item.매체);
    }

    // 한국어 컨텐츠 판정: 뉴스는 국가/제목 기준, 유튜브는 글로벌 공식이면 영문, 그 외에는 한글 포함 여부
    function isKoreanItem(item) {
      if (item.type === 'youtube') {
        if (isOfficialChannel(item)) return false;
        return hasKorean(item.제목) || hasKorean(item.매체);
      }
      // 뉴스 기사
      if (item.국가 === '국내') return true;
      if (item.국가 === '미국') return false;
      return hasKorean(item.제목);
    }

    // 아이템의 수집일시에서 YYYY-MM-DD 추출
    function getItemDate(item) {
      // 핀 항목은 사용자가 지정한 표시 날짜(pinned_for_date)를 우선 사용
      if (item.pinned_for_date) return item.pinned_for_date;
      const raw = item.수집일시 || item.collected_at || '';
      if (!raw) return '';
      if (raw.includes('T')) return raw.split('T')[0];
      if (raw.includes(' ')) return raw.split(' ')[0];
      return raw.slice(0, 10);
    }

    // 선택된 날짜 기준으로 아이템 필터링
    function filterByDate(items) {
      if (selectedDate === 'all') return items;
      return items.filter(item => getItemDate(item) === selectedDate);
    }

    // 최근 7일치 날짜 목록을 오늘 기준으로 생성 (최신순)
    function buildDateTabs() {
      const tabEl = document.getElementById('date-tabs');
      if (!tabEl) return;

      // 데이터에 존재하는 날짜별 아이템 수 집계
      const counts = {};
      currentData.forEach(item => {
        const d = getItemDate(item);
        if (!d) return;
        counts[d] = (counts[d] || 0) + 1;
      });

      // 오늘부터 6일 전까지 최대 7개 날짜 나열 (최신 → 과거)
      const today = new Date();
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        dates.push(`${yyyy}-${mm}-${dd}`);
      }

      const totalCount = currentData.length;
      const labels = ['오늘', '어제', '2일 전', '3일 전', '4일 전', '5일 전', '6일 전'];

      let html = `<span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mr-2">
        <i class="far fa-calendar-alt mr-1"></i> 날짜별 보기
      </span>`;

      // '전체' 버튼
      html += `<button class="date-tab ${selectedDate === 'all' ? 'selected' : ''}" onclick="filterDate('all')">
        전체 <span class="count">${totalCount}</span>
      </button>`;

      dates.forEach((d, i) => {
        const c = counts[d] || 0;
        const mmdd = d.slice(5).replace('-', '.');
        html += `<button class="date-tab ${selectedDate === d ? 'selected' : ''}" onclick="filterDate('${d}')" ${c === 0 ? 'style="opacity:.45;"' : ''}>
          ${labels[i]} <span class="text-[10px] font-normal opacity-70">(${mmdd})</span> <span class="count">${c}</span>
        </button>`;
      });

      tabEl.innerHTML = html;
    }

    function filterDate(date) {
      selectedDate = date;
      buildDateTabs();
      renderData();
    }

    // overrides.json 비동기 로드 (캐시 무력화 + 5분 주기 재로드)
    async function loadOverrides() {
      try {
        const r = await fetch(`overrides.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!r.ok) throw new Error('overrides.json fetch failed: ' + r.status);
        const data = await r.json();
        overridesData = {
          deleted: Array.isArray(data.deleted) ? data.deleted : [],
          pinned: Array.isArray(data.pinned) ? data.pinned : [],
        };
      } catch (e) {
        console.warn('[overrides] fallback to empty:', e);
        overridesData = { deleted: [], pinned: [] };
      }
    }

    // RAW_NEWS_DATA + overrides 를 합성해 currentData 갱신
    function applyOverrides() {
      const deletedSet = new Set(overridesData.deleted || []);
      // 1) 자동 수집분에서 삭제된 URL 제외
      const filtered = RAW_NEWS_DATA.filter(item => {
        const link = item.링크 || item.link;
        return !deletedSet.has(link);
      });
      // 2) 핀 항목에 표시용 메타데이터 부여
      const pinned = (overridesData.pinned || []).map(p => ({
        ...p,
        pinned: true,
        // 수집일시는 미래 시각이면 현재로 클램프 (옛날 핀의 09:00:00 폴백 + 시계 차이 방어)
        수집일시: (p.수집일시 && new Date(p.수집일시) <= new Date()) ? p.수집일시 : new Date().toISOString(),
      }));
      currentData = [...filtered, ...pinned];
    }

    async function init() {
      await loadOverrides();
      applyOverrides();

      // 오늘 데이터가 없으면 가장 최근에 데이터 있는 날짜로 자동 폴백 (액션 미실행 시 어제 등).
      // 7일 전까지 모두 비어 있으면 effectiveDate() 가 오늘을 그대로 반환 → 빈 화면 메시지 노출.
      selectedDate = effectiveDate();

      buildDateTabs();
      renderData();
      if (currentData.length > 0) {
        const lastItem = currentData[0];
        const lastUpdate = new Date(lastItem.수집일시);
        document.getElementById('last-update').innerText = `업데이트: ${lastUpdate.toLocaleString('ko-KR')}`;
      }

      const topBtn = document.getElementById('scroll-top-btn');
      const onScroll = () => {
        if (window.scrollY > 320) topBtn.classList.add('visible');
        else topBtn.classList.remove('visible');
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      // 5분마다 overrides.json 재로드 → 본인이 admin.html 에서 변경한 내용 자동 반영
      setInterval(async () => {
        await loadOverrides();
        applyOverrides();
        buildDateTabs();
        renderData();
      }, 5 * 60 * 1000);
    }

    function switchView(view) {
      currentView = view;
      const contentArea = document.getElementById('content-area');
      const newsSection = document.getElementById('news-section');
      const youtubeSection = document.getElementById('youtube-section');
      const usSection = document.getElementById('us-news-section');

      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`btn-${view}`).classList.add('tab-active');

      if (view === 'all') {
        contentArea.className = 'split-view';
        newsSection.style.display = 'block';
        youtubeSection.style.display = 'block';
        youtubeSection.classList.add('border-l');
        usSection.style.display = 'block';
      } else if (view === 'news') {
        contentArea.className = 'block';
        newsSection.style.display = 'block';
        youtubeSection.style.display = 'none';
        usSection.style.display = 'block';
      } else if (view === 'youtube') {
        contentArea.className = 'block';
        newsSection.style.display = 'none';
        youtubeSection.style.display = 'block';
        youtubeSection.classList.remove('border-l');
        usSection.style.display = 'none';
      }
      renderData();
    }

    function pinnedBadgeHtml() {
      return `<span class="ml-1 px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 text-[9px] font-bold uppercase tracking-wider border border-amber-200"><i class="fas fa-thumbtack mr-0.5"></i>고정</span>`;
    }

    function articleCardHtml(item, accent) {
      const accentColor = accent === 'us' ? 'text-indigo-600' : 'text-blue-600';
      const hoverColor = accent === 'us' ? 'group-hover:text-indigo-600' : 'group-hover:text-blue-600';
      const href = item.링크 || '#';
      const pinnedBadge = item.pinned ? pinnedBadgeHtml() : '';
      return `
        <a href="${href}" target="_blank" rel="noopener noreferrer" class="card group flex flex-col h-full overflow-hidden ${item.pinned ? 'ring-1 ring-amber-200' : ''}">
          ${item.이미지 ? `
            <div class="h-44 w-full overflow-hidden bg-gray-100">
              <img src="${item.이미지}" alt="news" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
          ` : ''}
          <div class="p-5 flex flex-col flex-grow">
            <div class="flex justify-between items-center mb-3">
              <span class="text-[10px] font-bold ${accentColor} uppercase tracking-wider flex items-center">${item.매체 || 'NEWS'}${pinnedBadge}</span>
              <span class="text-[10px] text-gray-400">${timeSince(item.수집일시)}</span>
            </div>
            <h4 class="text-base font-bold text-gray-800 ${hoverColor} transition-colors line-clamp-2 mb-3 leading-snug">
              ${item.제목}
            </h4>
            <p class="text-xs text-gray-500 line-clamp-3 mb-4">
              ${item.요약 || '상세 내용은 링크를 참조하세요.'}
            </p>
            <div class="mt-auto flex justify-between items-center text-[10px] text-gray-400 pt-3 border-t border-gray-50">
              <span>${item.국가 || '국내'}</span>
              <i class="fas fa-arrow-right"></i>
            </div>
          </div>
        </a>
      `;
    }

    // 핀(고정) 항목을 항상 배열의 맨 앞으로 이동시키는 안정 정렬
    function sortPinnedFirst(items) {
      const pinned = items.filter(it => it.pinned);
      const rest = items.filter(it => !it.pinned);
      return [...pinned, ...rest];
    }

    // 핀 → 한국어 → 영문 순서로 안정 정렬.
    // 한 그룹(핀/일반) 안에서 무조건 한국어 컨텐츠가 영문 컨텐츠보다 위에 오도록 함.
    function sortKoreanFirst(items) {
      const buckets = { pinKr: [], pinEn: [], restKr: [], restEn: [] };
      for (const it of items) {
        const kr = isKoreanItem(it);
        if (it.pinned) (kr ? buckets.pinKr : buckets.pinEn).push(it);
        else            (kr ? buckets.restKr : buckets.restEn).push(it);
      }
      return [...buckets.pinKr, ...buckets.pinEn, ...buckets.restKr, ...buckets.restEn];
    }

    function renderData() {
      const newsList = document.getElementById('news-list');
      const youtubeList = document.getElementById('youtube-list');
      const usList = document.getElementById('us-news-list');

      const dateScope = filterByDate(currentData);

      // 국내(한국) 뉴스 기사
      const koreanNews = sortPinnedFirst(dateScope.filter(item =>
        (item.type === 'article' || !item.type) && (item.국가 === '국내')
      ));

      // 유튜브: 핀 → 한국어 → 영문(글로벌 공식) 순서로 정렬
      const youtubeVideos = sortKoreanFirst(dateScope.filter(shouldShowYouTube));

      // 미국/해외 기사 (국가 === '미국')
      const usNews = sortPinnedFirst(dateScope.filter(item =>
        (item.type === 'article' || !item.type) && (item.국가 === '미국')
      ));

      newsList.innerHTML = koreanNews.length
        ? koreanNews.map(item => articleCardHtml(item, 'kr')).join('')
        : `<div class="col-span-full py-10 text-center text-gray-400 text-sm">해당 날짜의 국내 뉴스가 없습니다.</div>`;

      youtubeList.innerHTML = youtubeVideos.length ? youtubeVideos.map(item => {
        const official = isOfficialChannel(item);
        const officialBadge = official
          ? `<span class="ml-1 px-1.5 py-0.5 rounded bg-red-50 text-red-600 text-[9px] font-bold uppercase tracking-wider border border-red-100">공식</span>`
          : '';
        const pinnedBadge = item.pinned ? pinnedBadgeHtml() : '';
        const viewCountStr = formatViewCount(item.view_count);
        const postedAgo = timeSince(videoPostedAt(item));
        // YouTube 채널 표기와 동일하게 "조회수 X · X시간 전" 형식
        const metaLine = viewCountStr
          ? `${viewCountStr} <span class="text-gray-300 mx-0.5">·</span> ${postedAgo}`
          : postedAgo;
        return `
        <a href="${item.링크 || '#'}" target="_blank" rel="noopener noreferrer" class="card group flex flex-col h-full overflow-hidden ${item.pinned ? 'ring-1 ring-amber-200' : ''}">
          <div class="relative h-44 w-full bg-black">
            <img src="${item.이미지}" alt="youtube" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
              <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center shadow-lg">
                <i class="fas fa-play text-white text-xs ml-0.5"></i>
              </div>
            </div>
          </div>
          <div class="p-5 flex flex-col flex-grow">
            <div class="flex justify-between items-center mb-2">
              <span class="text-[10px] font-bold text-red-600 uppercase tracking-wider flex items-center">${item.매체}${officialBadge}${pinnedBadge}</span>
            </div>
            <h4 class="text-base font-bold text-gray-800 group-hover:text-red-600 transition-colors line-clamp-2 mb-2 leading-snug">
              ${item.제목}
            </h4>
            <div class="text-[11px] text-gray-500 mb-2 flex items-center gap-1">
              ${metaLine}
            </div>
            <p class="text-xs text-gray-500 line-clamp-2">
              ${item.요약}
            </p>
          </div>
        </a>
      `;
      }).join('') : `<div class="col-span-full py-10 text-center text-gray-400 text-sm">해당 날짜의 추천 유튜브 영상이 없습니다.</div>`;

      usList.innerHTML = usNews.length
        ? usNews.map(item => articleCardHtml(item, 'us')).join('')
        : `<div class="col-span-full py-10 text-center text-gray-400 text-sm">해당 날짜의 해외 기사가 없습니다.</div>`;
    }

    // 영상 게시일 우선 (YouTube 표기와 동일하게). 폴백: 수집일시.
    function videoPostedAt(item) {
      return item.published_at || item.날짜 || item.수집일시 || '';
    }

    // 조회수 한국식 포맷 (YouTube 표기와 동일: 1.2만회 / 12만회 / 1.5억회 / 1,234회)
    function formatViewCount(n) {
      if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '';
      n = Number(n);
      if (n < 1000)      return `조회수 ${n.toLocaleString('ko-KR')}회`;
      if (n < 10000)     return `조회수 ${(n / 1000).toFixed(1).replace(/\.0$/, '')}천회`;
      if (n < 100000000) {
        const v = n / 10000;
        return `조회수 ${v >= 10 ? Math.floor(v) : v.toFixed(1).replace(/\.0$/, '')}만회`;
      }
      const v = n / 100000000;
      return `조회수 ${v >= 10 ? Math.floor(v) : v.toFixed(1).replace(/\.0$/, '')}억회`;
    }

    function timeSince(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      // 미래 시각 방어: 음수면 '방금'으로 처리 (시계 차이/타임존/관리자 입력으로 미래가 들어오는 경우)
      if (seconds < 0) return '방금';
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "년 전";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "개월 전";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "일 전";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "시간 전";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "분 전";
      return Math.floor(seconds) + "초 전";
    }

    window.onload = init;
  </script>
</body>
</html>
