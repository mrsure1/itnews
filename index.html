<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Hub - 스마트한 AI 소식 큐레이션</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
      --card-border: rgba(0, 0, 0, 0.05);
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }
    .hero-banner {
      height: 200px;
      background: url('banner.png') center/cover no-repeat;
      border-radius: 1.5rem;
      position: relative;
      overflow: hidden;
      margin-bottom: 2rem;
      box-shadow: var(--card-shadow);
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
      display: flex;
      align-items: center;
      padding: 0 3rem;
    }
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border-color: var(--accent-primary);
    }
    .tab-active {
      background: var(--accent-primary);
      color: white !important;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }
    .split-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 1024px) {
      .split-view { grid-template-columns: 1fr; }
    }
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    /* 스크롤바 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-header px-6 py-3">
    <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-md">
          <i class="fas fa-robot text-white"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800">AI News Hub</h1>
      </div>

      <nav class="flex p-1 bg-gray-100 rounded-xl">
        <button id="btn-all" onclick="switchView('all')" class="px-5 py-1.5 rounded-lg text-sm font-semibold transition-all tab-active">전체보기</button>
        <button id="btn-news" onclick="switchView('news')" class="px-5 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:text-gray-800 transition-all">뉴스</button>
        <button id="btn-youtube" onclick="switchView('youtube')" class="px-5 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:text-gray-800 transition-all">유튜브</button>
      </nav>

      <div class="hidden md:flex items-center gap-4 text-xs text-gray-400">
        <span id="last-update">마지막 업데이트 확인 중...</span>
        <button onclick="location.reload()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-6 mt-6">
    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-overlay">
        <div>
          <h2 class="text-3xl font-extrabold text-gray-900 mb-2">AI News Hub</h2>
          <p class="text-gray-600 font-medium">최신 AI 기술과 트렌드를 한눈에 확인하세요.</p>
        </div>
      </div>
    </div>

    <!-- 상단: 한국 뉴스 + 한국 유튜브 (split-view) -->
    <div id="content-area" class="split-view">
      <!-- Left: Korean News Articles -->
      <section id="news-section">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-bold flex items-center gap-2">
            <i class="far fa-newspaper text-blue-600"></i> 국내 최신 뉴스
          </h3>
        </div>
        <div id="news-list" class="bento-grid">
          <div class="col-span-full py-20 text-center text-gray-400">로딩 중...</div>
        </div>
      </section>

      <!-- Right: Korean YouTube Videos -->
      <section id="youtube-section" class="border-l border-gray-200 pl-0 lg:pl-8">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-bold flex items-center gap-2">
            <i class="fab fa-youtube text-red-600"></i> 추천 AI 유튜브 (한국)
          </h3>
        </div>
        <div id="youtube-list" class="bento-grid">
          <!-- Videos -->
        </div>
      </section>
    </div>

    <!-- 하단: 미국 기사/블로그 카드 -->
    <section id="us-news-section" class="mt-12">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fas fa-globe-americas text-indigo-600"></i> 해외(미국) 기사 &amp; 블로그
        </h3>
      </div>
      <div id="us-news-list" class="bento-grid">
        <!-- US articles -->
      </div>
    </section>
  </main>

  <script src="news_data.js"></script>
  <script>
    let currentData = window.NEWS_DATA || [];
    let currentView = 'all';

    // 한국어 유튜브 채널 화이트리스트 (이 외의 채널은 모두 제외)
    const KOREAN_YT_CHANNELS = [
      'Nomad Coders',
      '코딩알려주는누나',
      '원투코딩 OneTwoCoding',
      '노정석',
      '테크몽',
      '조코딩 JoCoding'
    ];

    function isKoreanYouTube(item) {
      if (item.type !== 'youtube') return false;
      const m = (item.매체 || '').trim();
      return KOREAN_YT_CHANNELS.includes(m);
    }

    function init() {
      renderData();
      if (currentData.length > 0) {
        const lastItem = currentData[0];
        const lastUpdate = new Date(lastItem.수집일시);
        document.getElementById('last-update').innerText = `업데이트: ${lastUpdate.toLocaleString('ko-KR')}`;
      }
    }

    function switchView(view) {
      currentView = view;
      const contentArea = document.getElementById('content-area');
      const newsSection = document.getElementById('news-section');
      const youtubeSection = document.getElementById('youtube-section');
      const usSection = document.getElementById('us-news-section');

      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`btn-${view}`).classList.add('tab-active');

      if (view === 'all') {
        contentArea.className = 'split-view';
        newsSection.style.display = 'block';
        youtubeSection.style.display = 'block';
        youtubeSection.classList.add('border-l');
        usSection.style.display = 'block';
      } else if (view === 'news') {
        contentArea.className = 'block';
        newsSection.style.display = 'block';
        youtubeSection.style.display = 'none';
        usSection.style.display = 'block';
      } else if (view === 'youtube') {
        contentArea.className = 'block';
        newsSection.style.display = 'none';
        youtubeSection.style.display = 'block';
        youtubeSection.classList.remove('border-l');
        usSection.style.display = 'none';
      }
      renderData();
    }

    function articleCardHtml(item, accent) {
      const accentColor = accent === 'us' ? 'text-indigo-600' : 'text-blue-600';
      const hoverColor = accent === 'us' ? 'hover:text-indigo-600' : 'hover:text-blue-600';
      return `
        <div class="card flex flex-col h-full overflow-hidden">
          ${item.이미지 ? `
            <div class="h-44 w-full overflow-hidden bg-gray-100">
              <img src="${item.이미지}" alt="news" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
          ` : ''}
          <div class="p-5 flex flex-col flex-grow">
            <div class="flex justify-between items-center mb-3">
              <span class="text-[10px] font-bold ${accentColor} uppercase tracking-wider">${item.매체 || 'NEWS'}</span>
              <span class="text-[10px] text-gray-400">${timeSince(item.수집일시)}</span>
            </div>
            <a href="${item.링크}" target="_blank" class="text-base font-bold text-gray-800 ${hoverColor} transition-colors line-clamp-2 mb-3 leading-snug">
              ${item.제목}
            </a>
            <p class="text-xs text-gray-500 line-clamp-3 mb-4">
              ${item.요약 || '상세 내용은 링크를 참조하세요.'}
            </p>
            <div class="mt-auto flex justify-between items-center text-[10px] text-gray-400 pt-3 border-t border-gray-50">
              <span>${item.국가 || '국내'}</span>
              <i class="fas fa-arrow-right"></i>
            </div>
          </div>
        </div>
      `;
    }

    function renderData() {
      const newsList = document.getElementById('news-list');
      const youtubeList = document.getElementById('youtube-list');
      const usList = document.getElementById('us-news-list');

      // 국내(한국) 뉴스 기사
      const koreanNews = currentData.filter(item =>
        (item.type === 'article' || !item.type) && (item.국가 === '국내')
      );

      // 한국어 유튜브 채널만
      const koreanYoutube = currentData.filter(isKoreanYouTube);

      // 미국/해외 기사 (국가 === '미국')
      const usNews = currentData.filter(item =>
        (item.type === 'article' || !item.type) && (item.국가 === '미국')
      );

      newsList.innerHTML = koreanNews.length
        ? koreanNews.map(item => articleCardHtml(item, 'kr')).join('')
        : `<div class="col-span-full py-10 text-center text-gray-400 text-sm">국내 뉴스가 없습니다.</div>`;

      youtubeList.innerHTML = koreanYoutube.length ? koreanYoutube.map(item => `
        <div class="card flex flex-col h-full overflow-hidden group">
          <div class="relative h-44 w-full bg-black">
            <img src="${item.이미지}" alt="youtube" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
              <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center shadow-lg">
                <i class="fas fa-play text-white text-xs ml-0.5"></i>
              </div>
            </div>
          </div>
          <div class="p-5 flex flex-col flex-grow">
            <div class="flex justify-between items-center mb-3">
              <span class="text-[10px] font-bold text-red-600 uppercase tracking-wider">${item.매체}</span>
              <span class="text-[10px] text-gray-400">${timeSince(item.수집일시)}</span>
            </div>
            <a href="${item.링크}" target="_blank" class="text-base font-bold text-gray-800 hover:text-red-600 transition-colors line-clamp-2 mb-3 leading-snug">
              ${item.제목}
            </a>
            <p class="text-xs text-gray-500 line-clamp-2">
              ${item.요약}
            </p>
          </div>
        </div>
      `).join('') : `<div class="col-span-full py-10 text-center text-gray-400 text-sm">표시할 한국어 채널 영상이 없습니다.</div>`;

      usList.innerHTML = usNews.length
        ? usNews.map(item => articleCardHtml(item, 'us')).join('')
        : `<div class="col-span-full py-10 text-center text-gray-400 text-sm">해외 기사가 없습니다.</div>`;
    }

    function timeSince(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "년 전";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "개월 전";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "일 전";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "시간 전";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "분 전";
      return Math.floor(seconds) + "초 전";
    }

    window.onload = init;
  </script>
</body>
</html>
