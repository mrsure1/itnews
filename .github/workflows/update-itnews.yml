name: Update IT News Daily

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23 * * *' # 매일 한국 시간 오전 8시 (UTC 23:00)에 실행
  workflow_dispatch: # 수동 실행 

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 레포지토리 수정 권한 부여 (뉴스 파일, 이미지 파일 커밋/푸시 용도)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 최신의 안정적인 버전 사용

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify YouTube API secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY secret is not set."
            exit 1
          fi
          echo "YOUTUBE_API_KEY secret is set."

      - name: Run IT News and YouTube collectors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          python collect_news.py

      - name: Verify YouTube keyword search items
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path

          data = json.loads(Path("news_data.json").read_text(encoding="utf-8"))
          now = datetime.now()
          cutoff = now - timedelta(hours=6)

          def parsed_collected_at(item):
              raw = item.get("수집일시") or item.get("collected_at") or ""
              if not raw:
                  return None
              try:
                  return datetime.fromisoformat(raw)
              except ValueError:
                  return None

          recent_youtube = [
              item for item in data
              if item.get("type") == "youtube"
              and (dt := parsed_collected_at(item)) is not None
              and dt >= cutoff
          ]
          keyword_items = [item for item in recent_youtube if item.get("source") == "kw_search"]

          print(f"Recent YouTube items collected in this run window: {len(recent_youtube)}")
          print(f"Recent Korean keyword-search YouTube items: {len(keyword_items)}")

          if not recent_youtube:
              raise SystemExit("No recent YouTube items were collected.")
          if not keyword_items:
              raise SystemExit("No Korean YouTube keyword-search items were collected. Check YOUTUBE_API_KEY/search quota or query response.")
          PY

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update IT News data and images" || echo "No changes to commit"
          git push || echo "No changes to push"
